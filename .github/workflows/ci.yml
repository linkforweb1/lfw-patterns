name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint dei pattern
        run: php bin/lint-patterns.php

  manifest:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Rigenera manifest.json
        run: php bin/build-manifest.php
      - name: Commit se cambiato
        run: |
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "manifest.json: rigenerato dalla CI [skip ci]"
            git push
          else
            echo "Nessuna modifica al manifest."
          fi
